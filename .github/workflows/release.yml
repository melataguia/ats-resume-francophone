# When a version tag (v1.0.0, v1.1.0...) is pushed, build the skill ZIP and
# publish a GitHub release with it. Release text: .github/release-notes.md,
# to update before each new tag.
# Quand un tag de version (v1.0.0, v1.1.0...) est poussé, construit le ZIP du
# skill et publie une release GitHub avec. Texte de la release :
# .github/release-notes.md, à mettre à jour avant chaque nouveau tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ZIP holds the skill folder itself, with SKILL.md inside, as Claude expects.
      # Le ZIP contient le dossier du skill lui-même, avec SKILL.md dedans, comme Claude l'attend.
      - name: Build the skill ZIP
        run: |
          cd skills
          zip -r -X ../cv-ats-francophone.zip cv-ats-francophone -x "*.DS_Store" "*/__pycache__/*"
          unzip -l ../cv-ats-francophone.zip

      # If the release already exists (tag moved or pushed again), only replace its ZIP.
      # Si la release existe déjà (tag déplacé ou repoussé), on remplace seulement son ZIP.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" cv-ats-francophone.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" cv-ats-francophone.zip \
              --title "CV ATS francophone $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          fi
